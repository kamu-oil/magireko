<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マギレコ設定判別</title>
</head>
<body style="font-family:sans-serif; padding:16px; max-width:600px; margin:auto;">

<div>
  <div>今回の弱チェ間隔(G)</div>
  <div style="margin-top:6px;">
    <input id="input" type="number" min="1" style="width:100%; padding:10px; font-size:18px; box-sizing:border-box;">
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button onclick="loadData()" style="flex:1; padding:12px;">復元</button>
      <button onclick="add()" style="flex:1; padding:12px;">記録</button>
    </div>
  </div>
</div>

<div style="margin-top:12px;">累計G: <span id="totalG">0</span></div>
<div>平均出現率: <span id="avg">-</span></div>

<hr>
<div id="settings"></div>
<hr>
<div id="analysis"></div>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
  <button onclick="addBonus('low','big')" style="padding:12px;">～250G BIG</button>
  <button onclick="addBonus('low','reg')" style="padding:12px;">～250G REG</button>
  <button onclick="addBonus('high','big')" style="padding:12px;">251G～ BIG</button>
  <button onclick="addBonus('high','reg')" style="padding:12px;">251G～ REG</button>
</div>

<script>
let history = [];
let bonus = {lowBig:0, lowReg:0, highBig:0, highReg:0};
const STORAGE_KEY = "magireco_history";

const totalG = document.getElementById("totalG");
const avg = document.getElementById("avg");
const settings = document.getElementById("settings");
const analysis = document.getElementById("analysis");
const input = document.getElementById("input");

/* 記録 */
function add(){
  const v = Number(input.value);
  if(!Number.isFinite(v) || v <= 0){
    input.value="";
    return;
  }
  history.push(v);
  input.value="";
  saveDataSilent();
  render();
}

/* ボーナス：ゲーム数帯・種類ごとに記録 */
function addBonus(range, type){
  const key = `${range}${type === "big" ? "Big" : "Reg"}`;
  bonus[key] = (bonus[key] || 0) + 1;
  saveDataSilent();
  render();
}

/* 自動保存 */
function saveDataSilent(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({history, bonus}));
}

/* 復元 */
function loadData(){
  const data = localStorage.getItem(STORAGE_KEY);

  if(!data){
    alert("データなし");
    return;
  }

  try{
    const obj = JSON.parse(data);
    history = Array.isArray(obj.history) ? obj.history : [];

    // 旧形式 {low, high} のデータも読み込めるように変換
    if(obj.bonus && (
      "lowBig" in obj.bonus || "lowReg" in obj.bonus ||
      "highBig" in obj.bonus || "highReg" in obj.bonus
    )){
      bonus = {
        lowBig: Number(obj.bonus.lowBig) || 0,
        lowReg: Number(obj.bonus.lowReg) || 0,
        highBig: Number(obj.bonus.highBig) || 0,
        highReg: Number(obj.bonus.highReg) || 0
      };
    }else if(obj.bonus && ("low" in obj.bonus || "high" in obj.bonus)){
      const oldLow = Math.max(0, Number(obj.bonus.low) || 0);
      const oldHigh = Math.max(oldLow, Number(obj.bonus.high) || 0);
      // 旧データはBIG/REG内訳がないため、REG側に集計を引き継ぐ
      bonus = {lowBig:0, lowReg:oldLow, highBig:0, highReg:oldHigh-oldLow};
    }else{
      bonus = {lowBig:0, lowReg:0, highBig:0, highReg:0};
    }

    saveDataSilent();
    render();
    alert("復元しました");
  }catch(e){
    alert("復元失敗");
  }
}

/* 73G以内連カウント */
function buildStreaks(){
  const result = [];
  let cur = 0;
  let prevWas74 = false;

  for(let i=0;i<history.length;i++){
    const x = history[i];

    if(x >= 74){
      if(cur > 0){
        result.push(cur);
        cur = 0;
      }

      if(i === 0 || prevWas74){
        result.push(0);
      }

      prevWas74 = true;

    }else{
      cur++;
      prevWas74 = false;
    }
  }

  if(cur > 0){
    result.push(cur);
  }

  return result;
}

/* 73G連判定 */
function countTier(n){
  const s = buildStreaks();

  return {
    success: s.filter(x => x >= n).length,
    total: s.length
  };
}

/* 理論スケール */
function stepScaleTheory(actualTotal, baseNum, baseDen){
  if(actualTotal <= baseDen){
    return {
      text: `${baseNum}/${baseDen}`,
      num: baseNum
    };
  }

  const step = Math.ceil(actualTotal / baseDen);

  return {
    text: `${baseNum * step}/${baseDen * step}`,
    num: baseNum * step
  };
}

/* 107Gハマリ */
function calcHama(){
  return history.filter(x => x >= 107).length;
}

/* 設定推定 */
function calcSetting(){
  const rates = [60,57.7,55.5,53.5,51.7,50];

  let logs = rates.map(r=>{
    const p = 1/r;

    return history.reduce((s,x)=>{
      return s + ((x-1)*Math.log(1-p)+Math.log(p));
    },0);
  });

  const max = Math.max(...logs);
  const exp = logs.map(v => Math.exp(v-max));
  const sum = exp.reduce((a,b)=>a+b,0);

  return rates.map((r,i)=>{
    const pct = history.length ? exp[i]/sum*100 : 0;

    const isMax =
      history.length &&
      pct === Math.max(...rates.map((_,j)=>exp[j]/sum*100));

    return `
      <div>
        設定${i+1} (1/${Number(r).toFixed(1)}) :
        <span style="
          color:${isMax ? 'red':'black'};
          font-weight:${isMax ? 'bold':'normal'};
        ">
          ${pct.toFixed(1)}%
        </span>
      </div>
    `;
  }).join("");
}

function ratioNum(value, total, theoryNum, theoryDen){
  const isHigh = total > 0 && value / total >= theoryNum / theoryDen;
  return isHigh
    ? `<span style="color:red;font-weight:bold">${value}</span>`
    : `<span>${value}</span>`;
}

/* 表示 */
function render(){
  const sum = history.reduce((a,b)=>a+b,0);

  totalG.textContent = history.length ? sum : 0;
  avg.textContent = history.length
    ? "1/" + (sum/history.length).toFixed(1)
    : "-";

  const s1 = countTier(1);
  const s7 = countTier(7);
  const s8 = countTier(8);

  settings.innerHTML = calcSetting();

  /* 107Gハマリ */
  const hamaCount = calcHama();
  const hamaTheory = stepScaleTheory(history.length,2,15);

  const hamaNum =
    (history.length > 0 && hamaCount <= hamaTheory.num)
    ? `<span style="color:red;font-weight:bold">${hamaCount}</span>`
    : `<span>${hamaCount}</span>`;

  /* 73G連 */
  const s1Theory = stepScaleTheory(s1.total,3,4);
  const s7Theory = stepScaleTheory(s7.total,2,15);
  const s8Theory = stepScaleTheory(s8.total,1,10);

  const s1Num =
    (s1.success >= s1Theory.num)
    ? `<span style="color:red;font-weight:bold">${s1.success}</span>`
    : `<span>${s1.success}</span>`;

  const s7Num =
    (s7.success >= s7Theory.num)
    ? `<span style="color:red;font-weight:bold">${s7.success}</span>`
    : `<span>${s7.success}</span>`;

  const s8Num =
    (s8.success >= s8Theory.num)
    ? `<span style="color:red;font-weight:bold">${s8.success}</span>`
    : `<span>${s8.success}</span>`;

  /* ボーナス集計 */
  const lowTotal = bonus.lowBig + bonus.lowReg;
  const highTotal = bonus.highBig + bonus.highReg;
  const allTotal = lowTotal + highTotal;
  const allBig = bonus.lowBig + bonus.highBig;

  // 高設定目安はどちらも3/4。標本数に応じて理論値をスケール
  const bonusTheory = stepScaleTheory(allTotal,3,4);
  const bigTheory = stepScaleTheory(allTotal,3,4);

  const lowNum = ratioNum(lowTotal, allTotal, 3, 4);
  const bigNum = ratioNum(allBig, allTotal, 3, 4);

  analysis.innerHTML = `
    <div>107Gハマリ: ${hamaNum}/${history.length} (理論 ${hamaTheory.text})</div>
    <hr>

    <div>73G以内1連: ${s1Num}/${s1.total} (理論 ${s1Theory.text})</div>
    <div>73G以内7連: ${s7Num}/${s7.total} (理論 ${s7Theory.text})</div>
    <div>73G以内8連: ${s8Num}/${s8.total} (理論 ${s8Theory.text})</div>
    <hr>

    <div>～250G: ${lowNum}/${allTotal} (高域 ${bonusTheory.text})</div>
    <div>BIG比率: ${bigNum}/${allTotal} (高域 ${bigTheory.text})</div>
  `;
}

render();
</script>
</body>
</html>
